<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon.jpeg">
    <title>NTU轉乘系統 - 主控制台</title>
    
    <!-- 圖示與字型 -->
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Bobkao0527/bobtaipeiMRT/20296ecd31b8fa2372a545c4e5f991954d6b29ac/icon.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        :root {
            --neon-cyan: #00f2ff;
            --neon-blue: #3b82f6;
            --neon-purple: #a855f7;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --dark-bg: #030712;
            --glass-bg: rgba(15, 23, 42, 0.85);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--dark-bg);
            color: #f1f5f9;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 255, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
        }

        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }

        .tech-font {
            font-family: 'Rajdhani', sans-serif;
        }

        /* 霓虹文字與邊框發光特效 */
        .neon-glow-cyan {
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.7), 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .neon-border-cyan {
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.25), inset 0 0 15px rgba(0, 242, 255, 0.1);
        }

        /* Iframe 主容器 */
        .iframe-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000000;
            overflow: hidden;
        }

        /* 多重 Iframe 專用獨立樣式 */
        .app-iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.99);
            z-index: 1;
        }

        .app-iframe.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            z-index: 10;
        }

        /* 磨砂玻璃面板 */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* 底部導覽頁籤樣式 */
        .nav-tab {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 0.5rem 0.25rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            color: #64748b;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .nav-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: var(--neon-cyan);
            border-radius: 999px;
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: transform 0.3s ease;
        }

        .nav-tab:hover {
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-tab.active {
            color: var(--neon-cyan);
            background: linear-gradient(180deg, rgba(0, 242, 255, 0.12) 0%, rgba(0, 242, 255, 0) 100%);
        }

        .nav-tab.active::before {
            transform: translateX(-50%) scaleX(1);
        }

        .nav-tab i {
            font-size: 1.15rem;
            margin-bottom: 0.25rem;
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .nav-tab.active i {
            transform: translateY(-2px);
            filter: drop-shadow(0 0 8px rgba(0, 242, 255, 0.8));
        }

        .nav-tab span {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
            max-width: 100%;
        }

        /* 旋轉微光動畫 */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .pulse-dot {
            animation: pulse-glow 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <!-- 頂部高科技狀態列 -->
    <header class="glass-panel flex-none px-4 py-2.5 border-b border-cyan-500/20 z-30 shadow-xl relative">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <!-- 左側系統標題與圖示 -->
            <div class="flex items-center gap-3">
                <div class="relative flex items-center justify-center w-8 h-8 rounded-lg bg-cyan-950/60 border border-cyan-500/40 text-cyan-400">
                    <i class="fa-solid fa-compass-drafting text-sm"></i>
                    <span class="absolute -top-1 -right-1 flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-cyan-500"></span>
                    </span>
                </div>
                <div>
                    <h1 id="title-text" class="text-sm md:text-base cyber-font font-black tracking-widest text-white flex items-center gap-2">
                        <span>NTU</span>
                        <span class="text-cyan-400 neon-glow-cyan">TRANSIT</span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 tech-font hidden sm:inline-block">v2.5 SYS</span>
                    </h1>
                    <p class="text-[10px] text-slate-400 tracking-wider font-mono flex items-center gap-1.5">
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span>
                        <span class="text-emerald-400 font-bold">ONLINE</span>
                        <span class="text-slate-600">|</span>
                        <span>即時通勤計算系統</span>
                    </p>
                </div>
            </div>

            <!-- 右側控制與時間 display -->
            <div class="flex items-center gap-3">
                <!-- 手動重新整理當前頁面按鈕 -->
                <button onclick="reloadCurrentPage()" title="重新整理當前頁面" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-900/60 border border-slate-700/60 text-slate-400 hover:text-cyan-400 hover:border-cyan-500/50 transition-all active:scale-95">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                </button>

                <div class="h-6 w-[1px] bg-slate-800"></div>

                <!-- 數位時間 -->
                <div class="text-right">
                    <p id="current-time-display" class="cyber-font text-lg md:text-xl font-black text-cyan-400 neon-glow-cyan leading-none">--:--:--</p>
                    <p class="text-[9px] tech-font text-slate-400 tracking-widest uppercase">SYSTEM CLOCK</p>
                </div>
            </div>
        </div>
    </header>

    <!-- 中間 Iframe 內容區域 -->
    <main class="iframe-wrapper">
        <!-- 載入中過渡動畫 -->
        <div id="frame-loader" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center gap-4 z-25 transition-opacity duration-300 pointer-events-none opacity-0">
            <div class="relative w-16 h-16 flex items-center justify-center">
                <!-- 雙圈旋轉特效 -->
                <div class="absolute inset-0 border-2 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin"></div>
                <div class="absolute inset-2 border-2 border-purple-500/20 border-b-purple-400 rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
                <i class="fa-solid fa-microchip text-cyan-400 text-lg animate-pulse"></i>
            </div>
            <div class="text-center">
                <p class="cyber-font text-xs text-cyan-400 tracking-[0.3em] uppercase font-bold animate-pulse">
                    LOADING_MODULE
                </p>
                <p class="text-[10px] text-slate-500 font-mono mt-1">ESTABLISHING DATA CONNECTION...</p>
            </div>
        </div>

        <!-- 讀取失敗提示視窗 (精簡版：無範例匡，直觀提示) -->
        <div id="error-display" class="hidden absolute inset-0 bg-slate-950/95 backdrop-blur-lg flex flex-col items-center justify-center p-6 text-center z-40">
            <div class="p-6 rounded-2xl border border-red-500/30 bg-slate-900/90 max-w-sm w-full space-y-4 shadow-2xl shadow-red-950/40 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-red-500 to-transparent"></div>
                
                <div class="w-12 h-12 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 flex items-center justify-center mx-auto text-xl">
                    <i class="fa-solid fa-circle-exclamation"></i>
                </div>

                <div>
                    <h3 class="cyber-font text-base font-bold text-red-400 tracking-wider">讀取 pages.json 失敗</h3>
                    <p class="text-xs text-slate-400 mt-1">無法獲取選單資料，請確認 <code class="text-red-300 font-mono">pages.json</code> 是否已正確放置於同層目錄中。</p>
                </div>

                <button onclick="loadPagesJson()" class="w-full py-2.5 bg-red-500/15 hover:bg-red-500/25 border border-red-500/40 text-red-300 cyber-font text-xs rounded-xl tracking-widest transition-all active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrows-rotate text-xs"></i>
                    <span>RETRY SYSTEM</span>
                </button>
            </div>
        </div>

        <!-- 動態堆疊的常駐 iframe 容器 -->
        <div id="iframe-stack" class="w-full h-full relative">
            <!-- JavaScript 會在這裡動態插入多個 <iframe class="app-iframe"> -->
        </div>
    </main>

    <!-- 底部頁面切換欄 (頁籤選單) -->
    <nav class="glass-panel flex-none border-t border-cyan-500/20 px-3 py-1.5 z-30 shadow-2xl">
        <div id="nav-container" class="max-w-md mx-auto flex justify-around items-center gap-1">
            <!-- 由 JavaScript 動態抓取 pages.json 後填入 -->
        </div>
    </nav>

    <script>
        let pagesData = [];
        let activePageIndex = -1;
        const iframesMap = {}; // 快取 iframe 實體 DOM
        const iframeLoadedMap = {}; // 紀錄各 iframe 是否已載入完畢
        let lastClickTime = 0;

        // 時鐘更新函數 (包含秒數)
        function updateClock() {
            const now = new Date();
            const hh = now.getHours().toString().padStart(2, '0');
            const mm = now.getMinutes().toString().padStart(2, '0');
            const ss = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('current-time-display').innerText = `${hh}:${mm}:${ss}`;
        }

        // 隱藏/顯示 Loader 畫面
        function setLoaderState(show) {
            const loader = document.getElementById('frame-loader');
            if (show) {
                loader.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                loader.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // 重新整理當前頁面
        function reloadCurrentPage() {
            if (activePageIndex >= 0) {
                switchPage(activePageIndex, true);
            }
        }

        // 高效秒切頁面 (背景 iframes 常駐)
        function switchPage(index, forceReload = false) {
            if (!pagesData[index]) return;

            // 雙擊當前 Tab 可強制重新整理該 iframe
            const now = Date.now();
            if (index === activePageIndex && !forceReload) {
                if (now - lastClickTime < 300) {
                    forceReload = true;
                }
            }
            lastClickTime = now;

            const targetFrame = iframesMap[index];
            if (!targetFrame) return;

            if (forceReload) {
                iframeLoadedMap[index] = false;
                setLoaderState(true);
                targetFrame.src = pagesData[index].path;
            }

            activePageIndex = index;

            // 1. 若該 iframe 尚未載入完成，顯示載入動畫；若已載入，立即隱藏
            if (!iframeLoadedMap[index]) {
                setLoaderState(true);
            } else {
                setLoaderState(false);
            }

            // 2. 切換各 iframe 可視性 (透過 active class 控制 opacity 與 transform)
            Object.keys(iframesMap).forEach(key => {
                const k = Number(key);
                if (k === index) {
                    iframesMap[k].classList.add('active');
                } else {
                    iframesMap[k].classList.remove('active');
                }
            });

            // 3. 更新底部導覽按鈕 Active 高亮狀態
            document.querySelectorAll('.nav-tab').forEach((tab, i) => {
                if (i === index) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
        }

        // 讀取 pages.json 並為所有頁面創建常駐 background iframe
        async function loadPagesJson() {
            const errorDisplay = document.getElementById('error-display');
            const navContainer = document.getElementById('nav-container');
            const iframeStack = document.getElementById('iframe-stack');
            
            errorDisplay.classList.add('hidden');
            navContainer.innerHTML = '';
            iframeStack.innerHTML = '';

            try {
                // 自動發送請求讀取同層級 pages.json (避免快取)
                const res = await fetch(`./pages.json?t=${Date.now()}`);
                
                if (!res.ok) {
                    throw new Error(`HTTP Error Status: ${res.status}`);
                }

                pagesData = await res.json();

                if (!Array.isArray(pagesData) || pagesData.length === 0) {
                    throw new Error("pages.json 資料格式不正確或為空陣列");
                }

                // 為每一個頁面建立專屬的背景常駐 Iframe 與底部按鈕
                pagesData.forEach((page, idx) => {
                    // --- 建立常駐 Iframe ---
                    const frame = document.createElement('iframe');
                    frame.id = `app-frame-${idx}`;
                    frame.className = `app-iframe ${idx === 0 ? 'active' : ''}`;
                    frame.name = `app-frame-${idx}`;
                    
                    // 監聽各 iframe 的載入完成事件
                    iframeLoadedMap[idx] = false;
                    frame.addEventListener('load', () => {
                        iframeLoadedMap[idx] = true;
                        if (activePageIndex === idx) {
                            setLoaderState(false);
                        }
                    });

                    // 設定 iframe 路徑
                    frame.src = page.path;
                    iframeStack.appendChild(frame);
                    iframesMap[idx] = frame;

                    // --- 建立底部導覽選單按鈕 ---
                    const button = document.createElement('button');
                    button.className = `nav-tab ${idx === 0 ? 'active' : ''}`;
                    
                    const iconClass = page.icon || 'fa-solid fa-window-maximize';
                    const pageName = page.name || `頁面 ${idx + 1}`;

                    button.innerHTML = `
                        <i class="${iconClass}"></i>
                        <span>${pageName}</span>
                    `;

                    button.onclick = () => switchPage(idx);
                    navContainer.appendChild(button);
                });

                // 預設切換至第一個頁面
                switchPage(0);

            } catch (err) {
                console.error("載入 pages.json 失敗:", err);
                errorDisplay.classList.remove('hidden');
            }
        }

        // 支援鍵盤數字鍵切換頁籤 (1 ~ 9)
        window.addEventListener('keydown', (e) => {
            const keyNum = parseInt(e.key);
            if (!isNaN(keyNum) && keyNum >= 1 && keyNum <= pagesData.length) {
                switchPage(keyNum - 1);
            }
        });

        // 初始化系統
        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
            loadPagesJson();
        });
    </script>
</body>
</html>
